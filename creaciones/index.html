<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Creaciones | Michelangelo Comunidad</title><link rel="icon" href="../assets/logo-michelangelo.jpg"><style>body{margin:0;background:#faf7f0;color:#25312b;font:16px Arial,sans-serif}main{max-width:1100px;margin:auto;padding:70px 5%}a{color:inherit}.back{font-weight:bold}.eyebrow{color:#b76549;letter-spacing:.12em;font-size:.8rem}h1{font:clamp(3rem,8vw,6rem) Georgia,serif;margin:.3em 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:24px}.card{background:#fffdf8;padding:18px;border:1px solid #ddd;border-radius:16px}.card img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px}.empty{padding:36px;background:#fffdf8;border-radius:16px}</style></head><body><main><a class="back" href="../">← Comunidad</a><p class="eyebrow">CREACIONES PUBLICADAS</p><h1>Lo que imaginamos también merece un espacio.</h1><section id="list" class="grid" aria-live="polite"></section></main><script type="module">const c={apiKey:"AIzaSyDWSpVS8It00pQXE7I541w-ywTu6mvphIM",authDomain:"michelangelo-comunidad.firebaseapp.com",projectId:"michelangelo-comunidad"};const a=await import("https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js"),f=await import("https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js"),d=f.getFirestore(a.initializeApp(c)),l=document.querySelector('#list');f.onSnapshot(f.collection(d,'publicaciones'),s=>{l.innerHTML='';const x=s.docs.map(v=>v.data()).filter(v=>v.seccion==='creaciones');if(!x.length)l.innerHTML='<p class="empty">Aún no hay creaciones publicadas.</p>';x.forEach(v=>{const e=document.createElement('article');e.className='card';e.innerHTML=`${v.imagenUrl?`<img src="${v.imagenUrl}" alt="">`:''}<h2></h2><p></p><small></small>`;e.querySelector('h2').textContent=v.titulo;e.querySelector('p').textContent=v.descripcion;e.querySelector('small').textContent=v.autor;l.append(e)})})</script></body></html>
