<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Creaciones publicadas por Michelangelo Comunidad.">
  <title>Creaciones | Michelangelo Comunidad</title>
  <link rel="icon" href="../assets/logo-michelangelo.jpg">
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    .public-page{max-width:1120px;margin:auto;padding:48px 5% 90px}.public-back{display:inline-block;margin-bottom:42px;font-weight:700}.public-hero{max-width:760px;margin-bottom:52px}.public-hero h1{font-family:var(--serif,Georgia,serif);font-size:clamp(3.2rem,8vw,6.5rem);line-height:.95;letter-spacing:-.05em}.public-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:24px}.publication-card{overflow:hidden;border:1px solid var(--border,#ded8cf);background:var(--paper,#fffdf8)}.publication-card img{width:100%;aspect-ratio:1/1;object-fit:cover;background:#eee}.publication-copy{padding:20px}.publication-card h2{font-family:var(--serif,Georgia,serif);font-size:1.65rem;line-height:1.05}.publication-card p{margin:10px 0 16px;color:var(--ink-soft,#596057);line-height:1.55}.publication-card small{color:var(--terracotta,#b76549);font-weight:700}.public-state{padding:32px;border:1px solid var(--border,#ded8cf);background:var(--paper,#fffdf8);line-height:1.6}.public-state.error{border-color:#b76549;color:#8c4c36}
  </style>
</head>
<body>
  <main class="public-page">
    <a class="public-back" href="../">← Comunidad</a>
    <header class="public-hero">
      <p class="eyebrow">CREACIONES PUBLICADAS</p>
      <h1>Lo que imaginamos también merece un espacio.</h1>
    </header>
    <section id="list" class="public-grid" aria-live="polite"><p class="public-state">Cargando creaciones…</p></section>
  </main>
  <script type="module">
    const config={apiKey:"AIzaSyDWSpVS8It00pQXE7I541w-ywTu6mvphIM",authDomain:"michelangelo-comunidad.firebaseapp.com",projectId:"michelangelo-comunidad"};
    const list=document.querySelector('#list');
    const [{initializeApp},{getFirestore,collection,onSnapshot}]=await Promise.all([
      import('https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js'),
      import('https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js')
    ]);
    const db=getFirestore(initializeApp(config));
    const state=(message,error=false)=>{list.replaceChildren();const node=document.createElement('p');node.className=`public-state${error?' error':''}`;node.textContent=message;list.append(node)};
    onSnapshot(collection(db,'publicaciones'),snapshot=>{
      const items=snapshot.docs.map(doc=>doc.data()).filter(item=>item.seccion==='creaciones');
      list.replaceChildren();
      if(!items.length){state('Aún no hay creaciones publicadas. Vuelve pronto para conocer el trabajo de la comunidad.');return}
      items.sort((a,b)=>(b.publicadoEn?.seconds||0)-(a.publicadoEn?.seconds||0));
      for(const item of items){
        const card=document.createElement('article');card.className='publication-card';
        if(item.imagenUrl){const image=document.createElement('img');image.src=item.imagenUrl;image.alt=`Creación: ${item.titulo||'sin título'}`;image.loading='lazy';card.append(image)}
        const copy=document.createElement('div');copy.className='publication-copy';
        const title=document.createElement('h2');title.textContent=item.titulo||'Sin título';
        const description=document.createElement('p');description.textContent=item.descripcion||'';
        const author=document.createElement('small');author.textContent=item.autor||'Comunidad Michelangelo';
        copy.append(title,description,author);card.append(copy);list.append(card);
      }
    },()=>state('No fue posible cargar las creaciones. Inténtalo nuevamente en unos minutos.',true));
  </script>
</body>
</html>
